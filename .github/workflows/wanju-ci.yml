name: Wanju source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wanju-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test apps/desktop/scripts/wanju-release-options.test.mjs apps/desktop/scripts/wanju-signing.test.mjs scripts/wanju-public-source.test.mjs
      - run: pnpm typecheck
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the reviewed gitleaks version
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          expected="$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" { print $1 }' "$RUNNER_TEMP/checksums.txt")"
          test -n "$expected"
          echo "$expected  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the public Git history without exposing matched values
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-level warn --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
          scan_status=$?
          set -e
          if test "$scan_status" -ne 0 && test -f "$RUNNER_TEMP/gitleaks.json"; then
            node -e 'const fs=require("node:fs");const p=require("node:path");const findings=JSON.parse(fs.readFileSync(p.join(process.env.RUNNER_TEMP,"gitleaks.json"),"utf8"));console.log(JSON.stringify(findings.map(f=>({rule:f.RuleID,file:f.File,line:f.StartLine}))))'
          fi
          exit "$scan_status"
